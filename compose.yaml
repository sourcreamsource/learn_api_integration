# Compose 파일 형식에서 실행할 서비스 목록을 시작한다.
services:
    # AI GitGen CLI 컨테이너 서비스를 정의한다.
    ai-gitgen:
        # 현재 폴더의 Dockerfile로 이미지를 만들도록 지정한다.
        build:
            # 현재 폴더를 Docker 빌드 문맥으로 사용한다.
            context: .
        # 만들어진 이미지에 알아보기 쉬운 로컬 이름을 붙인다.
        image: ai-gitgen:local
        # 호스트 Git 저장소를 읽을 컨테이너 폴더를 지정한다.
        working_dir: /workspace
        # API 설정을 호스트 환경변수에서 컨테이너로 전달한다.
        environment:
            # 실제 Key 값을 Compose 파일에 쓰지 않고 실행 환경에서 받는다.
            AI_API_KEY: ${AI_API_KEY:?AI_API_KEY 환경변수가 필요합니다}
            # 요청 형식은 값이 없으면 openai를 사용한다.
            AI_API_FORMAT: ${AI_API_FORMAT:-anthropic}
            # 모델 ID는 값이 없으면 프로그램 기본값을 사용한다.
            AI_MODEL: ${AI_MODEL:-claude-haiku-4}
            # 전체 API URL은 .env에 반드시 있어야 하며 기본 주소로 대체하지 않는다.
            AI_API_URL: ${AI_API_URL:?AI_API_URL 환경변수가 필요합니다}
        # 현재 Git 저장소를 컨테이너에 읽기 전용으로 연결한다.
        volumes:
            # 콜론 뒤 ro는 Read Only의 약자이며 컨테이너가 파일을 수정하지 못하게 한다.
            - .:/workspace:ro
        # 기본 실습은 커밋 메시지 초안을 생성한다.
        command: ["commit"]
