[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gitgen"
version = "1.0.0"
description = "Generate commit messages and pull request drafts from Git changes with an AI API."
requires-python = ">=3.10"

[project.scripts]
ai-gitgen = "ai_gitgen.cli:main"

[tool.setuptools.packages.find]
include = ["ai_gitgen*"]
